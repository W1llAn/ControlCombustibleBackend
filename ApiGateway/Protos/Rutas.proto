syntax = "proto3";

option csharp_namespace = "Microservicio_Rutas.Protos";

package Rutas;

enum Estado {
  ELIMINADO = 0;
  ACTIVO = 1;
}
message Ruta{
  int32 id = 1;
  string nombre = 2;
  string puntoInicio = 3;
  string puntoFin = 4;
  double distancia = 5;
  Estado estado=6;
}

message CrearRutaRequest {
  string nombre = 1;
  string puntoInicio = 2;
  string puntoFin = 3;
  double distancia = 4;
  Estado estado=5;
}

message ActualizarRutaRequest {
  int32 id = 1;
  string nombre = 2;
  string puntoInicio = 3;
  string puntoFin = 4;
  double distancia = 5;
  Estado estado=6;
}

message EliminarRutaRequest {
  int32 id = 1;
}

message EliminarRutaResponse {
  bool exito = 1;
}

message ListaRutas{
  repeated Ruta rutas = 1;
}

message RespuestaVaciaRuta {}

message ObtenerRutaRequest {
  int32 id = 1;
}

service RutasService {
  rpc CrearRuta(CrearRutaRequest) returns (Ruta);
  rpc ActualizarRuta(ActualizarRutaRequest) returns (Ruta);
  rpc EliminarRuta(EliminarRutaRequest) returns (EliminarRutaResponse);
  rpc ObtenerRutaId(ObtenerRutaRequest) returns (Ruta);
  rpc ObtenerTodasRutas(RespuestaVaciaRuta) returns (ListaRutas);
}


