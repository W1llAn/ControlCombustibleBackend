version: '3.8'

services:
      
  microservicio-autenticacion:
    build:
      context: ./MicroservicioAutenticacion
      dockerfile: Dockerfile
    container_name: microservicio-autenticacion
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - postgres-db
    restart: unless-stopped
    networks:
      - red-ms

  microservicio-choferes:
    build:
      context: ./MicroservicioChoferes
      dockerfile: Dockerfile
    container_name: microservicio-choferes
    ports:
      - "5002:8080"
      - "5003:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GrpcServicios__Usuarios=http://microservicio-autenticacion:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - microservicio-autenticacion
    restart: unless-stopped
    networks:
      - red-ms

  microservicio-vehiculos-livianos:
    build:
      context: ./MicroservicioVehiculos
      dockerfile: Dockerfile
    container_name: microservicio-vehiculos-livianos
    ports:
      - "5004:8080"
      - "5005:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - microservicio-autenticacion
    restart: unless-stopped
    networks:
      - red-ms
  microservicio-vehiculos-pesados:
    build:
      context: ./MicroservicioVehiculos
      dockerfile: Dockerfile
    container_name: microservicio-vehiculos-pesados
    ports:
      - "5018:8080"
      - "5019:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - microservicio-autenticacion
    restart: unless-stopped
    networks:
      - red-ms
  microservicio-rutas:
      build:
        context: ./MicroservicioRutas
        dockerfile: Dockerfile
      container_name: microservicio-rutas
      ports:
        - "5010:8080"
        - "5011:8081"
      environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
      depends_on:
        - microservicio-autenticacion
      restart: unless-stopped
      networks:
        - red-ms

  microservicio-asignacion-rutas-livianos:
    build:
      context: ./MicroservicioAsignacionRutas
      dockerfile: Dockerfile
    container_name: microservicio-asignacion-rutas-livianos
    ports:
      - "5006:8080"
      - "5007:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - microservicio-rutas
    restart: unless-stopped
    networks:
      - red-ms
  microservicio-asignacion-rutas-pesados:
    build:
      context: ./MicroservicioAsignacionRutas
      dockerfile: Dockerfile
    container_name: microservicio-asignacion-rutas-pesados
    ports:
      - "5020:8080"
      - "5021:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - microservicio-rutas
    restart: unless-stopped
    networks:
      - red-ms
  
      #MicroservicioConsumoCombustible

  microservicio-consumo-combustible-livianos:
    build:
      context: ./MicroservicioConsumoCombustible
      dockerfile: Dockerfile
    container_name: microservicio-consumo-combustible-livianos
    ports:
      - "5028:8080"
      - "5029:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - microservicio-asignacion-rutas-livianos
    restart: unless-stopped
    networks:
      - red-ms

  microservicio-consumo-combustible-pesados:

    build:
      context: ./MicroservicioConsumoCombustible
      dockerfile: Dockerfile
    container_name: microservicio-consumo-combustible-pesados
    ports:
      - "5008:8080"
      - "5009:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - microservicio-asignacion-rutas-pesados
    restart: unless-stopped
    networks:
      - red-ms
  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: apigateway
    ports:
      - "5050:8080" # Puerto externo : puerto interno del contenedor
      - "5051:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

    depends_on:
      - microservicio-autenticacion
    restart: unless-stopped
    networks:
      - red-ms

  postgres-db:
    image: postgres:15
    container_name: postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: contraseña123
      POSTGRES_DB: UsuariosDB
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red-ms

volumes:
  postgres_data:

networks:
  red-ms:
