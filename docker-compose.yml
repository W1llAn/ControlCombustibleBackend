  microservicio-autenticacion:
    build:
      context: ./MicroservicioAutenticacion
      dockerfile: Dockerfile
    container_name: microservicio-autenticacion
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - postgres-db
    restart: unless-stopped
    networks:
      - red-ms

  microservicio-vehiculos-livianos:
    build:
      context: ./MicroservicioVehiculos
      dockerfile: Dockerfile
    container_name: microservicio-vehiculos-livianos
    ports:
      - "5002:8080"
      - "5003:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=UsuariosDB;Username=usuario;Password=contraseña123
    depends_on:
      - postgres-db
    restart: unless-stopped
    networks:
      - red-ms


  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: apigateway
    ports:
      - "5050:8080" # Puerto externo : puerto interno del contenedor
      - "5051:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

    depends_on:
      - microservicio-autenticacion
    restart: unless-stopped
    networks:
      - red-ms

  postgres-db:
    image: postgres:15
    container_name: postgres-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: contraseña123
      POSTGRES_DB: UsuariosDB
    ports:
      - "5555:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red-ms

volumes:
  sql_data:
  postgres_data:

networks:
  red-ms:
