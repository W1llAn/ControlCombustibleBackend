
version: '3.8'

services:

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    container_name: apigateway
    network_mode: host
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - grcp__autenticacion=http://52.226.126.56:5050
      - grcp__vehiculos-livianos=http://172.191.76.83:5004
      - grcp__vehiculos-pesados=http://20.169.243.51:5018
      - grcp__choferes=http://52.226.126.56:5002
      - grcp__rutas=http://52.226.126.56:5010
      - grcp__asignacionrutasLiviana=http://172.191.76.83:5006
      - grcp__asignacionrutasPesada=http://20.169.243.51:5020
      - grcp__consumocombustiblePesado=http://20.169.243.51:5008
      - grcp__consumocombustibleLiviano=http://172.191.76.83:5028


  microservicio-autenticacion:
    build:
      context: ./MicroservicioAutenticacion
      dockerfile: Dockerfile
    container_name: microservicio-autenticacion
    ports:
      - "5050:8080"
      - "5051:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=10.0.0.4;Port=5432;Database=combustibledb;Username=postgres1;Password=200232
    networks:
      - red-ms

  microservicio-choferes:
    build:
      context: ./MicroservicioChoferes
      dockerfile: Dockerfile
    container_name: microservicio-choferes
    ports:
      - "5002:8080"
      - "5003:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - GrpcServicios__Usuarios=http://microservicio-autenticacion:8080
      - ConnectionStrings__DefaultConnection=Host=10.0.0.4;Port=5432;Database=combustibledb;Username=postgres1;Password=200232
    networks:
      - red-ms

  microservicio-rutas:
    build:
      context: ./MicroservicioRutas
      dockerfile: Dockerfile
    container_name: microservicio-rutas
    ports:
      - "5010:8080"
      - "5011:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=10.0.0.4;Port=5432;Database=combustibledb;Username=postgres1;Password=200232
    networks:
      - red-ms


networks:
  red-ms:
